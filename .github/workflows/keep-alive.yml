name: Keep-alive ping (24/7)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://saki-gateway.indevs.in/health || echo "000")
          echo "health: $code"
          if [ "$code" != "200" ]; then
            # one retry after 20s in case of a cold start blip
            sleep 20
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://saki-gateway.indevs.in/health || echo "000")
            echo "health retry: $code"
            if [ "$code" != "200" ]; then
              echo "::warning::Backend health check failed twice with $code"
            fi
          fi