# ─── API Server ──────────────────────────────────────────
api:
  type: web
  region: oregon
  plan: starter
  runtime: python
  buildCommand: pip install --only-binary=:all: -r backend/requirements.txt || pip install -r backend/requirements.txt
  startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  envVars:
    - key: APP_NAME
      value: AI Gateway
    - key: DEBUG
      value: "false"
    - key: SECRET_KEY
      generateValue: true
    - key: ADMIN_EMAIL
      value: admin@example.com
    - key: DATABASE_URL
      value: sqlite+aiosqlite:///./ai_gateway.db
    - key: USE_SQLITE
      value: "true"
    - key: PORT
      value: "8000"

# ─── PostgreSQL Database (optional — set DATABASE_URL to enable) ──
# ai-gateway-db:
#   type: psql
#   plan: starter
#   databaseName: ai_gateway
#   ipAllowList: []

# ─── Redis Cache (optional — set REDIS_URL to enable) ──
# ai-gateway-redis:
#   type: redis
#   plan: starter
#   maxmemoryPolicy: allkeys-lru
