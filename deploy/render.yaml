# Render.com Blueprint for AI Gateway

api:
  type: web
  region: oregon
  plan: pro
  runtime: docker
  dockerfilePath: Dockerfile
  healthCheckPath: /health
  envVars:
    - key: DATABASE_URL
      fromService:
        type: psql
        name: ai-gateway-db
        envVarName: DATABASE_URL
    - key: REDIS_URL
      fromService:
        type: redis
        name: ai-gateway-redis
        envVarName: REDIS_URL
    - key: SECRET_KEY
      value: your-secret-key-here-change-in-production
    - key: DEBUG
      value: false
    - key: ADMIN_EMAIL
      value: admin@example.com
    - key: ADMIN_PASSWORD
      generateValue: true
    - key: PYTHONUNBUFFERED
      value: "1"
  diskOk: true

db:
  type: psql
  plan: pro
  databaseName: ai-gateway
  ipAllowList: []

redis:
  type: redis
  plan: pro
  maxmemoryPolicy: allkeys-lru
